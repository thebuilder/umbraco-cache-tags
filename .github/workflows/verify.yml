name: Verify package

# Everything a change has to pass. CI runs it on every push and pull request with the project
# file's version. The publish workflow runs it with the version from the release tag, and
# publishes the package it uploads.
on:
  workflow_call:
    inputs:
      package-version:
        description: The version for the NuGet package. Empty uses the project file's.
        type: string
        default: ""
      release-tag:
        description: The GitHub Release tag the NuGet release notes link to.
        type: string
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # The package and its tests across the Umbraco range: the lowest release it allows and the
  # newest of each major, so a dependency floor or an API that moved shows up before a site meets it.
  # Only the tests project, because the sample pins its own Umbraco release
  # (SampleUmbracoVersion) and would conflict with an overridden range.
  dotnet:
    name: .NET (Umbraco ${{ matrix.umbraco-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        umbraco-version:
          - 17.4.0
          - 17.*
          - 18.*
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Central package management, so there is no lock file to key on: the versions all
      # live in Directory.Packages.props and the projects decide which to reference.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ matrix.umbraco-version }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ matrix.umbraco-version }}-

      # TreatWarningsAsErrors is on for every project, so this is the warning gate too.
      - name: Test
        env:
          UMBRACO_VERSION: ${{ matrix.umbraco-version }}
        run: dotnet test tests/TheBuilder.CacheTags.Tests -c Release "-p:UmbracoVersion=$UMBRACO_VERSION"

  # The documentation site, so a page that does not build fails the change that broke it rather
  # than the next deploy. The build also draws the Open Graph cards and the favicon from the logo.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build documentation
        run: pnpm docs:build

  # The backoffice client, which only `dotnet pack` builds, so a type error shows up here rather
  # than at release.
  client:
    name: Backoffice client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the root package.json's packageManager field, so CI and the
      # csproj's `corepack pnpm` cannot end up on different majors.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # The sample frontend, so a change to the webhook route or the fetch helper that does not
  # type-check or build fails here. The e2e job below runs it against Umbraco.
  nextjs:
    name: Next.js sample
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: samples/nextjs
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      # The sample is not in the root workspace: it is a site of its own, with its own lockfile. Its
      # pnpm version must match the root package.json's, because setup-node reads the pnpm store
      # path at the repository root, and a different version keeps its packages somewhere else.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: samples/nextjs/package.json

      # The sample's engines field asks for 22.18 or later; 22 resolves to the newest 22.x.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: samples/nextjs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # The whole loop on one server: the sample Umbraco with the package, the Next.js sample, `pnpm keys`
  # checking every seeded response's header, and `pnpm e2e` publishing changes through the Management
  # API and waiting for the pages to refresh. On the sample's own Umbraco release
  # (SampleUmbracoVersion), with a fresh SQLite database, once as the sample runs and once with
  # Umbraco's Delivery API output cache on, which the package must evict before it purges.
  # Not for a release: it runs the package's project, not the packed file a release publishes, and a
  # flaky run should not hold a release back.
  e2e:
    name: End to end (${{ matrix.name }})
    if: inputs.package-version == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: one server
            output-cache: "false"
          - name: output cache on
            output-cache: "true"
    # A healthy run takes 6 to 7 minutes. The slow steps have limits of their own (the waits below,
    # and timeout-minutes on the steps after them), so a stalled step fails, rather than the whole job
    # being cancelled, and the thread dump and logs still run inside these 20 minutes.
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      UMBRACO_URL: http://localhost:5320
      FRONTEND_URL: http://localhost:3000
      # Right after a first start the Delivery API index is slow to pick up a publish.
      E2E_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-default-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-default-

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: samples/nextjs/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: samples/nextjs/pnpm-lock.yaml

      - name: Install the Next.js sample
        working-directory: samples/nextjs
        run: pnpm install --frozen-lockfile

      - name: Build the Umbraco sample
        run: dotnet build samples/TheBuilder.CacheTags.Example -c Release

      # It installs itself into a new SQLite database and seeds the content on the first start.
      # Development, for the settings the sample runs with locally (its application URL).
      # The built app itself rather than `dotnet run`, so the process id is Umbraco's.
      - name: Start Umbraco
        working-directory: samples/TheBuilder.CacheTags.Example
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://localhost:5320
          # One server, so the cache instruction sync has nothing to apply: this server applies its own
          # refreshes at once, which is what the suite checks. On SQLite, Umbraco's sync (it reads the
          # instructions, then writes umbracoLastSynced in the same transaction) can deadlock with a
          # request writing its instructions, which stalls the suite for minutes. Syncing hourly keeps it
          # out of the run.
          Umbraco__CMS__Global__DatabaseServerMessenger__TimeBetweenSyncOperations: "01:00:00"
          Umbraco__CMS__DeliveryApi__OutputCache__Enabled: ${{ matrix.output-cache }}
        run: |
          nohup dotnet bin/Release/net10.0/TheBuilder.CacheTags.Example.dll > "$RUNNER_TEMP/umbraco.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/umbraco.pid"

      # The Next.js listing pages cache an empty listing for an hour, so nothing fetches them before
      # the seeding has finished (Winter market is the last item it publishes) and Umbraco's Delivery
      # API index has the three seeded articles (about 70 seconds on a first start). Fails as soon as
      # Umbraco stops or reports a failed boot, and after 150 seconds in any case.
      - name: Wait for the seeded site and the Delivery API index
        timeout-minutes: 3
        run: |
          deadline=$((SECONDS + 150))
          while (( SECONDS < deadline )); do
            if ! kill -0 "$(cat "$RUNNER_TEMP/umbraco.pid")" 2>/dev/null; then
              echo "Umbraco stopped." >&2
              exit 1
            fi
            if grep -qE "post-migration initialization failed|BootFailedException|stalled on a hung database connection" "$RUNNER_TEMP/umbraco.log"; then
              echo "Umbraco's boot failed or its database stalled; see the logs." >&2
              exit 1
            fi
            winter="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -H 'Accept-Language: en-US' \
              "$UMBRACO_URL/umbraco/delivery/api/v2/content/item/e0000000-0000-0000-0000-000000000026" || true)"
            articles="$(curl -sf --max-time 5 "$UMBRACO_URL/umbraco/delivery/api/v2/content?fetch=children:/articles/" | jq -r '.total' || true)"
            if [[ "$winter" == 200 && "$articles" == 3 ]]; then
              echo "Seeded, and the index has the 3 articles after ${SECONDS}s."
              exit 0
            fi
            sleep 5
          done
          echo "Umbraco was not seeded and indexed within 150 seconds." >&2
          exit 1

      - name: Build and start the Next.js sample
        timeout-minutes: 2
        working-directory: samples/nextjs
        run: |
          pnpm build
          nohup pnpm start > "$RUNNER_TEMP/nextjs.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null "$FRONTEND_URL/" && exit 0
            sleep 2
          done
          echo "The Next.js sample did not answer." >&2
          exit 1

      # The keys of every seeded response, against the seeders, before anything is changed.
      - name: Cache keys
        timeout-minutes: 1
        working-directory: samples/nextjs
        run: pnpm keys

      # About 3 minutes when healthy.
      - name: End to end
        timeout-minutes: 8
        working-directory: samples/nextjs
        run: pnpm e2e

      # Where every thread in Umbraco is, for a boot that stalls on the database.
      - name: Umbraco's threads
        if: failure()
        timeout-minutes: 1
        run: |
          dotnet tool install --global dotnet-stack || true
          ~/.dotnet/tools/dotnet-stack report --process-id "$(cat "$RUNNER_TEMP/umbraco.pid")" || true

      - name: Logs
        if: failure()
        run: |
          echo "::group::Umbraco"
          cat "$RUNNER_TEMP/umbraco.log" || true
          echo "::endgroup::"
          echo "::group::Next.js"
          cat "$RUNNER_TEMP/nextjs.log" || true
          echo "::endgroup::"

  # The same suite on two Umbraco servers sharing one SQL Server database, the way a load-balanced
  # site runs (samples/two-servers/run.sh). The Next.js sample reads server A, and every change is
  # made on B, so a purge that went out before A had applied the change would leave A's old content
  # in the frontend's cache. This is what the ack barrier is for, and only two servers can show it.
  e2e-two-servers:
    name: End to end (two servers)
    if: inputs.package-version == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      FRONTEND_URL: http://localhost:3000
      E2E_TIMEOUT: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-default-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-default-

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: samples/nextjs/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: samples/nextjs/pnpm-lock.yaml

      - name: Install the Next.js sample
        working-directory: samples/nextjs
        run: pnpm install --frozen-lockfile

      # SQL Server, then A (which installs and seeds the database), then B.
      - name: Start SQL Server and both servers
        timeout-minutes: 8
        run: samples/two-servers/run.sh

      # As in the one-server job: the seeding is done, and both servers' indexes have the articles.
      - name: Wait for the seeded site and both Delivery API indexes
        timeout-minutes: 4
        run: |
          deadline=$((SECONDS + 210))
          articles() { curl -sf --max-time 5 "$1/umbraco/delivery/api/v2/content?fetch=children:/articles/" | jq -r '.total' || true; }
          while (( SECONDS < deadline )); do
            winter="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -H 'Accept-Language: en-US' \
              "http://localhost:5320/umbraco/delivery/api/v2/content/item/e0000000-0000-0000-0000-000000000026" || true)"
            if [[ "$winter" == 200 && "$(articles http://localhost:5320)" == 3 && "$(articles http://localhost:5321)" == 3 ]]; then
              echo "Seeded, and both indexes have the 3 articles after ${SECONDS}s."
              exit 0
            fi
            sleep 5
          done
          echo "The site was not seeded and indexed on both servers within 210 seconds." >&2
          exit 1

      - name: Build and start the Next.js sample, reading server A
        timeout-minutes: 2
        working-directory: samples/nextjs
        env:
          UMBRACO_URL: http://localhost:5320
        run: |
          pnpm build
          nohup pnpm start > "$RUNNER_TEMP/nextjs.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf -o /dev/null "$FRONTEND_URL/" && exit 0
            sleep 2
          done
          echo "The Next.js sample did not answer." >&2
          exit 1

      - name: Cache keys on server A
        timeout-minutes: 1
        working-directory: samples/nextjs
        env:
          UMBRACO_URL: http://localhost:5320
        run: pnpm keys

      # Every change made on B.
      - name: End to end, changing server B
        timeout-minutes: 10
        working-directory: samples/nextjs
        env:
          UMBRACO_URL: http://localhost:5321
        run: pnpm e2e

      - name: Logs
        if: failure()
        run: |
          for server in a b; do
            echo "::group::Umbraco $server"
            cat "samples/two-servers/out/$server.log" || true
            echo "::endgroup::"
          done
          echo "::group::Next.js"
          cat "$RUNNER_TEMP/nextjs.log" || true
          echo "::endgroup::"

  package:
    name: Solution and package
    runs-on: ubuntu-latest
    # Not after the matrix: one Umbraco release failing its tests should not hide whether the
    # package builds, packs and installs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The backoffice bundle is not committed. `dotnet pack` builds it with `corepack pnpm build`,
      # then refuses to pack if the manifest or the entry point is missing: a package without them
      # installs into Umbraco and silently has no backoffice.
      - name: Enable corepack
        run: corepack enable

      - run: corepack pnpm install --frozen-lockfile

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-default-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-default-

      # The package, the sample site and the tests, on the versions the repository
      # declares. Never with an UmbracoVersion override: the package's dependency range comes from it.
      - name: Build solution
        run: dotnet build TheBuilder.CacheTags.slnx -c Release

      # A release passes its tag's version. Any other run packs the project file's version with a
      # suffix of its own, so the sample's restore below can only find the package this run built,
      # never one already on nuget.org. Written to GITHUB_ENV so later steps check the same version.
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.package-version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          else
            version="$(dotnet msbuild src/TheBuilder.CacheTags/TheBuilder.CacheTags.csproj -getProperty:Version)-ci.$RUN_NUMBER.$RUN_ATTEMPT"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      # EnablePackageValidation checks the package's own consistency (assets, target frameworks).
      - name: Pack
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          # From the run rather than written out, so a renamed repository or a fork links to itself.
          RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag
        run: |
          arguments=(
            src/TheBuilder.CacheTags/TheBuilder.CacheTags.csproj
            -c Release
            -o artifacts
            "-p:Version=$PACKAGE_VERSION"
            -p:ContinuousIntegrationBuild=true
            -p:EnablePackageValidation=true
          )
          if [[ -n "$RELEASE_TAG" ]]; then
            arguments+=("-p:PackageReleaseNotes=$RELEASES_URL/$RELEASE_TAG")
          fi
          dotnet pack "${arguments[@]}"

      # What nuget.org and the Umbraco Marketplace need from the package, checked in the archive itself.
      - name: Validate package
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          RELEASES_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag
        run: |
          package="artifacts/TheBuilder.CacheTags.$PACKAGE_VERSION.nupkg"
          unzip -t "$package"
          entries="$(unzip -Z1 "$package")"
          nuspec="$(unzip -p "$package" TheBuilder.CacheTags.nuspec)"
          manifest="staticwebassets/App_Plugins/TheBuilder.CacheTags/umbraco-package.json"

          for entry in README.md LICENSE icon.png lib/net10.0/TheBuilder.CacheTags.dll lib/net10.0/TheBuilder.CacheTags.xml \
            "$manifest" staticwebassets/App_Plugins/TheBuilder.CacheTags/cache-tags.js; do
            grep -Fqx "$entry" <<< "$entries" || { echo "The package is missing $entry." >&2; exit 1; }
          done
          # Umbraco reads the version from the manifest, so it has to be the package's.
          test "$(unzip -p "$package" "$manifest" | jq -r '.version')" = "$PACKAGE_VERSION"
          grep -Fq "<version>$PACKAGE_VERSION</version>" <<< "$nuspec"
          # The Marketplace lists packages from nuget.org by this tag.
          grep -Fq "umbraco-marketplace" <<< "$nuspec"
          # Every Umbraco dependency carries the range Directory.Packages.props declares, not one
          # release or a floating version. The nuspec writes [17.4.0,19.0.0) as [17.4.0, 19.0.0).
          range="$(dotnet msbuild src/TheBuilder.CacheTags/TheBuilder.CacheTags.csproj -getProperty:UmbracoVersion)"
          range="${range/,/, }"
          for dependency in Umbraco.Cms.Api.Common Umbraco.Cms.Api.Management Umbraco.Cms.Web.Common; do
            grep -Fq "<dependency id=\"$dependency\" version=\"$range\"" <<< "$nuspec" \
              || { echo "$dependency does not depend on $range." >&2; exit 1; }
          done
          if [[ -n "$RELEASE_TAG" ]]; then
            grep -Fq "<releaseNotes>$RELEASES_URL/$RELEASE_TAG</releaseNotes>" <<< "$nuspec"
          fi

      # The sample site restored from the packed file instead of the project, which is what an
      # installer does: it catches a dependency nuget.org does not have, which packing does not.
      # The cached copy goes first, because every run packs the same version and restore would
      # otherwise take the one an earlier run left in the cache.
      - name: Build sample from the package
        run: |
          rm -rf ~/.nuget/packages/thebuilder.cachetags
          dotnet build samples/TheBuilder.CacheTags.Example -c Release "-p:CacheTagsPackageVersion=$PACKAGE_VERSION"

      # The publish workflow pushes this exact file, so what is published is what was checked.
      - uses: actions/upload-artifact@v4
        with:
          name: TheBuilder.CacheTags-package
          path: artifacts/*.nupkg
          if-no-files-found: error
