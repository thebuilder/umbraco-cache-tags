name: Publish NuGet package

# Publishing a GitHub Release publishes the package: the tag is the version, the verify workflow
# builds and checks the package with it, and that same file is pushed to nuget.org. RELEASE.md has
# the one-time setup and the steps.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: Resolve package version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="${RELEASE_TAG#v}"

          # SemVer 2's grammar, prerelease included: a numeric identifier has no leading zero, so
          # 0.1.0-preview.01 is refused here rather than at the push to nuget.org.
          number='(0|[1-9][0-9]*)'
          identifier="($number|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
          semver="^$number\.$number\.$number(-$identifier(\.$identifier)*)?$"
          if [[ ! "$version" =~ $semver ]]; then
            echo "Expected a SemVer version such as v0.1.0 or v0.1.0-preview.1; got '$RELEASE_TAG'." >&2
            exit 1
          fi

          # NuGet decides prerelease from the version alone, so the GitHub Release has to agree,
          # or a release marked stable on GitHub would publish as a prerelease, and the reverse.
          if [[ "$RELEASE_IS_PRERELEASE" == "true" && "$version" != *-* ]]; then
            echo "A GitHub prerelease needs a prerelease version, such as v0.1.0-preview.1; got '$version'." >&2
            exit 1
          fi
          if [[ "$RELEASE_IS_PRERELEASE" != "true" && "$version" == *-* ]]; then
            echo "A stable GitHub release needs a stable version, such as v0.1.0; got '$version'." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: version
    uses: ./.github/workflows/verify.yml
    with:
      package-version: ${{ needs.version.outputs.value }}
      release-tag: ${{ github.event.release.tag_name }}

  publish:
    name: Publish to nuget.org
    needs: [version, verify]
    runs-on: ubuntu-latest
    # Required reviewers on this environment, if set, approve each publish before it runs.
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: TheBuilder.CacheTags-package
          path: artifacts

      # Trusted publishing: GitHub's short-lived OIDC token is exchanged for a temporary NuGet API
      # key, so no long-lived key is stored in GitHub.
      - name: Exchange OIDC token for a NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package to nuget.org
        run: >-
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
