# SQL Server for the two-server check (run.sh). Local development values only.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: LocalOnly-Sql-42!
    ports:
      - "14330:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LocalOnly-Sql-42!' -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
