packages:
  - src/TheBuilder.CacheTags/Client
  - apps/docs

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  # Download telemetry that Blume's API tooling pulls in. Its install script only reports the
  # download, so it never runs.
  '@scarf/scarf': false
  # Node's WebGPU backend for vgpu. The hero particles run in the browser, so it isn't needed.
  '@vgpu/adapter-node': false
  esbuild: true
  webgpu: false
minimumReleaseAgeExclude:
  # Our own packages are trusted, so new releases install right away.
  - '@thebuilder/*'
packageExtensions:
  # @astrojs/astro2tsx lists @emnapi/core but not @emnapi/runtime, which its wasm runtime needs as a
  # peer. pnpm then fills that peer with the 2.0.0-beta.2 that Vite 8.3.7's rolldown brings, and
  # `blume check` fails with "this.bridge.setLastError is not a function". Give it the 1.x runtime
  # that matches its @emnapi/core.
  '@astrojs/astro2tsx@0.1':
    dependencies:
      '@emnapi/runtime': 1.11.3
